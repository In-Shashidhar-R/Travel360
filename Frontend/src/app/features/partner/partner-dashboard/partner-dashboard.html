<!-- Main Workspace Context Matrix Container Viewport Frame -->
<div class="container-fluid p-4 admin-workspace-canvas-wrapper bg-light min-vh-100">
  
  <!-- Content Target Switch Payload Container Grid -->
  <main [ngSwitch]="activeSection" class="container-fluid p-0 grid-content-viewport">
    
    <app-partner-overview 
      *ngSwitchCase="'overview'"
      [partnerId]="partnerId"
      [partnerName]="partnerName"
      [totalServices]="totalServices"
      [activeServices]="activeServices"
      [inactiveServices]="inactiveServices">
    </app-partner-overview>

    <app-manage-services 
      *ngSwitchCase="'services'"
      [inventories]="inventories"
      [totalServices]="totalServices"
      (onActivate)="activate($event)"
      (onDeactivate)="deactivate($event)">
    </app-manage-services>

  </main>
</div>
