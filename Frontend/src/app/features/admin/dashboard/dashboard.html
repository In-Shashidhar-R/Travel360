<div class="container-fluid p-4 admin-workspace-canvas-wrapper bg-light min-vh-100">
  
  @if (alertMessage) {
    <div class="alert alert-dismissible shadow-sm fade show mb-4" [ngClass]="alertType === 'error' ? 'alert-danger' : 'alert-success'" role="alert">
      <i class="bi bi-info-circle-fill me-2"></i> {{ alertMessage }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  }

  <router-outlet></router-outlet>

</div>

<div class="modal fade" id="adminPasswordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-white shadow border-0">
      <div class="modal-header border-bottom p-3">
        <h5 class="modal-title fw-bold text-dark text-uppercase small tracking-wider">Change Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeAdminPasswordBtn"></button>
      </div>
      <form (ngSubmit)="submitPasswordRotation()">
        <div class="modal-body p-4 d-flex flex-column gap-3">
          
          @if (passwordError) {
            <div class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-0 shadow-sm border-0">
              <i class="bi bi-exclamation-triangle-fill text-danger"></i>
              <span class="fw-medium">{{ passwordError }}</span>
            </div>
          }

          <div>
            <label class="form-label small fw-bold text-secondary text-uppercase mb-1">Current Password</label>
            <input type="password" class="form-control form-control-sm p-2" [(ngModel)]="passwordForm.currentPassword" name="currentPassword" required autocomplete="current-password">
          </div>
          <div>
            <label class="form-label small fw-bold text-secondary text-uppercase mb-1">New Password</label>
            <input type="password" class="form-control form-control-sm p-2" [(ngModel)]="passwordForm.newPassword" name="newPassword" required autocomplete="new-password">
          </div>
        </div>
        <div class="modal-footer border-top p-2 bg-light">
          <button type="button" class="btn btn-sm btn-secondary px-3" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-sm btn-warning text-dark px-4 fw-bold">Change password</button>
        </div>
      </form>
    </div>
  </div>
</div>
